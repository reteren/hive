[package]
name = "hive"
version = "1.8.9"
description = "Spatial board for notes and tasks"
license = "MIT"
authors = ["reteren"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `tauri build` supplies it automatically, but `cargo build --release` does not:
# without it a release exe loads the dev server instead of the embedded dist.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "protocol-asset"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2.17"
tauri-plugin-dialog = "2.7.3"
notify = "8.2.0"
notify-debouncer-full = "0.6"
tauri-plugin-opener = "2.5.5"
spellbook = "0.4.2"
tauri-plugin-global-shortcut = "2"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
